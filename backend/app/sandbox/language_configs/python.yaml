base_image: "python:3.11-slim"
run_command: "sh -c 'pip install --no-cache-dir -r requirements.txt && (uvicorn main:app --host 0.0.0.0 --port 8000 || uvicorn app.main:app --host 0.0.0.0 --port 8000)'"
health_endpoint: "http://localhost:8000/health"
auth_endpoint: "http://localhost:8000/auth/login"
build_timeout_seconds: 900
boot_wait_seconds: 8
